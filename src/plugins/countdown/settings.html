<div class="form-group">
    <div class="form-group">
        <label for="title" class="form-label">Title</label>
        <input type="text" id="title" name="title" placeholder="Type something..." required class="form-input">
    </div>
    <div class="form-group">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" name="date" class="form-input" />
    </div>
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        {% for code, name in supported_languages.items() %}
        <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
    </select>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('title').value = pluginSettings.title || '';
            document.getElementById('date').value = pluginSettings.date;
            document.getElementById('language').value = pluginSettings.language || 'en';
        }
    });
</script>
