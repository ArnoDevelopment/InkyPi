{% extends "plugin.html" %}

{% block content %}

<div class="countdown-container">
    <div class="countdown-wrapper" style="--countdown-text-color: {{ plugin_settings.textColor }}; --countdown-outline-color: {{ text_outline_color }};">
        <h1 class="title">{{title}}</h1>
        <p class="subtitle">{{date}}</p>
        <div class="label">{{before_label}}</div>
        <div class="day_count">{{day_count}}</div>
        <div class="label">{{after_label}}</div>
    </div>
</div>

{% endblock %}
